name: Site

# Builds the cave and the classic site into one dist/, runs the checks, and on `main`
# deploys dist/ to GitHub Pages, once Pages is set to deploy from Actions (Settings →
# Pages → Source → GitHub Actions). Until then the live site is whatever the gh-pages
# branch holds, and the deploy is skipped with a notice. See docs/launch.md.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json
      - name: Install
        run: npm run setup
      - name: Build both sites
        run: npm run build
      - name: Size budgets (docs/v1-plan.md)
        working-directory: apps/cave
        run: npm run budget
      - name: Gesture check (the classifier on real hands, no browser)
        working-directory: apps/cave
        run: npm run test:gestures
      - name: Install Chromium for the checks
        working-directory: apps/cave
        run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (makes the fake webcam video for the camera check)
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Browser checks
        working-directory: apps/cave
        run: npx playwright test
      - name: Keep traces of failed checks
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: apps/cave/test-results
          retention-days: 7
      - name: Package for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Deploying from Actions only works once Pages is set to it; before that, say so and stop.
  pages-source:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      actions: ${{ steps.source.outputs.actions }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          if [ "$type" = workflow ]; then echo "actions=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Pages deploys from '$type', not GitHub Actions, so this run doesn't deploy. To launch: Settings → Pages → Source → GitHub Actions (docs/launch.md)."; fi

  deploy:
    needs: [build, pages-source]
    if: needs.pages-source.outputs.actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
