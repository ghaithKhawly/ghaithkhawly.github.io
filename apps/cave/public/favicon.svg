<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A hand stencil: red ochre blown round a hand on the rock, the oldest mark in caves. -->
  <defs>
    <radialGradient id="spray"><stop offset="0" stop-color="#e0662f"/><stop offset="0.62" stop-color="#c24a24" stop-opacity="0.92"/><stop offset="1" stop-color="#b03e1c" stop-opacity="0"/></radialGradient>
    <mask id="hand"><rect width="64" height="64" fill="#fff"/><g fill="#000">
      <ellipse cx="32" cy="41" rx="12" ry="13"/>
      <rect x="20" y="15" width="6" height="25" rx="3" transform="rotate(-9 23 27)"/>
      <rect x="27.5" y="10" width="6" height="29" rx="3"/>
      <rect x="35" y="13" width="6" height="27" rx="3" transform="rotate(7 38 26)"/>
      <rect x="41.5" y="21" width="5.5" height="21" rx="2.8" transform="rotate(16 44 31)"/>
      <rect x="11" y="33" width="6" height="17" rx="3" transform="rotate(-48 14 41)"/>
    </g></mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#160d08"/>
  <circle cx="32" cy="34" r="31" fill="url(#spray)" mask="url(#hand)"/>
</svg>
